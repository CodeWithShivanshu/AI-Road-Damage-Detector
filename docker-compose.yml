services:
  roadvision-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: roadvision-ai:latest
    container_name: roadvision_ai
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist detections, SQLite database, snapshots, and uploads on the host
      - ./data:/app/data
      # Mount model weights
      - ./weights:/app/weights
      # Mount detection runs and logs
      - ./runs:/app/runs
    restart: unless-stopped
